[project]
name = "classic-enigma"
version = "0.1.0"
description = "Educational Enigma I and M4 terminal simulator"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
enigma = "enigma.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "enigma"
module-root = "src"
source-include = ["tests/**", "examples/**"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6", "uv_build>=0.11,<0.12"]
